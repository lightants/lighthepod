  <path d="M40 220 C70 170, 100 250, 130 210 S190 150, 220 215 S280 270, 310 205 S370 140, 400 212 S460 260, 490 200 S550 140, 600 215" fill="none" stroke="#f6eee6" stroke-width="1.6" opacity="0.55"/>
  <circle cx="320" cy="220" r="28" fill="#0c0a12" stroke="#ff5a3c" stroke-width="2"/>
  <path d="M314 208 L336 220 L314 232 Z" fill="#ff5a3c"/>

  <rect width="640" height="400" filter="url(#grain)"/>
  <rect x="14" y="14" width="612" height="372" fill="none" stroke="#f6eee6" stroke-opacity="0.12" stroke-width="1"/>
