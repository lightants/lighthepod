<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Abstract lyric lines and bars">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1628"/>
      <stop offset="1" stop-color="#0b0910"/>
    </linearGradient>
    <radialGradient id="leak1" cx="88%" cy="8%" r="55%">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leak2" cx="8%" cy="92%" r="50%">
      <stop offset="0" stop-color="#d94a8a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d94a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.09"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#leak1)"/>
  <rect width="640" height="400" fill="url(#leak2)"/>
  
  <g fill="#f6eee6" opacity="0.75">
    <rect x="90" y="90" width="280" height="8" rx="4"/>
    <rect x="90" y="122" width="420" height="8" rx="4" opacity="0.45"/>
    <rect x="90" y="154" width="340" height="8" rx="4"/>
    <rect x="90" y="186" width="200" height="8" rx="4" opacity="0.45"/>
    <rect x="90" y="218" width="360" height="8" rx="4"/>
    <rect x="90" y="250" width="250" height="8" rx="4" opacity="0.45"/>
  </g>
  <g fill="#ff5a3c">
    <rect x="480" y="260" width="10" height="70" rx="2"/><rect x="500" y="230" width="10" height="100" rx="2"/>
    <rect x="520" y="200" width="10" height="130" rx="2"/><rect x="540" y="240" width="10" height="90" rx="2"/>
    <rect x="560" y="180" width="10" height="150" rx="2"/>
  </g>

  <rect width="640" height="400" filter="url(#grain)"/>
  <rect x="14" y="14" width="612" height="372" fill="none" stroke="#f6eee6" stroke-opacity="0.12" stroke-width="1"/>
</svg>
