<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Mixed timeline process demo, not a client file">
  <defs>
    <linearGradient id="process-mixed-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1628"/>
      <stop offset="1" stop-color="#0b0910"/>
    </linearGradient>
    <radialGradient id="process-mixed-l1" cx="88%" cy="8%" r="55%">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="process-mixed-l2" cx="8%" cy="92%" r="50%">
      <stop offset="0" stop-color="#d94a8a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d94a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="process-mixed-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#process-mixed-bg)"/>
  <rect width="640" height="400" fill="url(#process-mixed-l1)"/>
  <rect width="640" height="400" fill="url(#process-mixed-l2)"/>
  
  <text x="32" y="48" fill="#ff8a6a" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="3">MIXED · PROCESS DEMO</text>
  <rect x="48" y="118" width="544" height="40" rx="6" fill="#ff5a3c" opacity="0.55"/>
  <rect x="48" y="172" width="544" height="40" rx="6" fill="#f6eee6" opacity="0.22"/>
  <rect x="48" y="226" width="544" height="40" rx="6" fill="#d94a8a" opacity="0.38"/>
  <rect x="48" y="280" width="544" height="40" rx="6" fill="#f6eee6" opacity="0.12"/>
  <path d="M48 138 C120 128, 200 148, 280 136 S440 120, 592 140" fill="none" stroke="#0c0a12" stroke-width="2" opacity="0.55"/>
  <path d="M48 192 C140 180, 240 204, 360 188 S500 176, 592 196" fill="none" stroke="#ff8a6a" stroke-width="2"/>
  <g fill="#0c0a12" opacity="0.35">
    <rect x="70" y="238" width="70" height="16" rx="2"/><rect x="160" y="238" width="110" height="16" rx="2"/>
    <rect x="290" y="238" width="80" height="16" rx="2"/><rect x="390" y="238" width="140" height="16" rx="2"/>
  </g>

  <rect width="640" height="400" filter="url(#process-mixed-grain)"/>
  <rect x="14" y="14" width="612" height="372" fill="none" stroke="#f6eee6" stroke-opacity="0.12" stroke-width="1"/>
</svg>
