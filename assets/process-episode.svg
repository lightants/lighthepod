<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Long-form episode frame process demo, not a client file">
  <defs>
    <linearGradient id="process-episode-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1628"/>
      <stop offset="1" stop-color="#0b0910"/>
    </linearGradient>
    <radialGradient id="process-episode-l1" cx="88%" cy="8%" r="55%">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="process-episode-l2" cx="8%" cy="92%" r="50%">
      <stop offset="0" stop-color="#d94a8a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d94a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="process-episode-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#process-episode-bg)"/>
  <rect width="640" height="400" fill="url(#process-episode-l1)"/>
  <rect width="640" height="400" fill="url(#process-episode-l2)"/>
  
  <text x="32" y="48" fill="#ff8a6a" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="3">EPISODE · PROCESS DEMO</text>
  <rect x="70" y="90" width="500" height="220" rx="10" fill="#14101c" stroke="#f6eee6" stroke-opacity="0.2"/>
  <path d="M70 200 h500" stroke="#ff5a3c" stroke-width="2" opacity="0.45"/>
  <circle cx="320" cy="200" r="34" fill="#0c0a12" stroke="#ff5a3c" stroke-width="2"/>
  <path d="M312 186 L338 200 L312 214 Z" fill="#ff5a3c"/>
  <rect x="90" y="330" width="460" height="10" rx="5" fill="#f6eee6" opacity="0.15"/>
  <rect x="90" y="330" width="460" height="10" rx="5" fill="#ff5a3c" opacity="0.55"/>
  <text x="320" y="368" text-anchor="middle" fill="#c9c0b6" font-size="13" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="3">FULL CUT · 16:9</text>

  <rect width="640" height="400" filter="url(#process-episode-grain)"/>
  <rect x="14" y="14" width="612" height="372" fill="none" stroke="#f6eee6" stroke-opacity="0.12" stroke-width="1"/>
</svg>
