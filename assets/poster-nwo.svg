<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Abstract filmstrip frames">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1628"/>
      <stop offset="1" stop-color="#0b0910"/>
    </linearGradient>
    <radialGradient id="leak1" cx="88%" cy="8%" r="55%">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leak2" cx="8%" cy="92%" r="50%">
      <stop offset="0" stop-color="#d94a8a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d94a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.09"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#leak1)"/>
  <rect width="640" height="400" fill="url(#leak2)"/>
  
  <g fill="none" stroke="#f6eee6" stroke-width="1.4" opacity="0.7">
    <rect x="70" y="70" width="500" height="260" rx="6"/>
    <rect x="88" y="88" width="140" height="90"/><rect x="250" y="88" width="140" height="90"/><rect x="412" y="88" width="140" height="90"/>
    <rect x="88" y="200" width="140" height="90"/><rect x="250" y="200" width="140" height="90"/><rect x="412" y="200" width="140" height="90"/>
  </g>
  <rect x="250" y="88" width="140" height="90" fill="#ff5a3c" opacity="0.35"/>
  <path d="M70 200 h500 M320 70 v260" stroke="#d94a8a" stroke-width="1" opacity="0.4"/>
  <circle cx="320" cy="200" r="18" fill="#0c0a12" stroke="#ff5a3c"/>
  <circle cx="320" cy="200" r="6" fill="#ff5a3c"/>

  <rect width="640" height="400" filter="url(#grain)"/>
  <rect x="14" y="14" width="612" height="372" fill="none" stroke="#f6eee6" stroke-opacity="0.12" stroke-width="1"/>
</svg>
