  <circle cx="360" cy="132" r="10" fill="#5c4520"/>
  <circle cx="360" cy="132" r="4" fill="#e0b86a"/>
  <rect x="90" y="198" width="298" height="14" rx="2" fill="#2a211a"/>
  <!-- desk -->
  <rect x="70" y="330" width="340" height="16" rx="3" fill="#3b2e22"/>
  <rect x="78" y="346" width="324" height="120" fill="#231a14"/>
  <rect x="78" y="346" width="8" height="120" fill="#4a3a28"/>
  <rect x="394" y="346" width="8" height="120" fill="#4a3a28"/>
