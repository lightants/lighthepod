<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" fill="none" role="img" aria-labelledby="boothTitle boothDesc">
  <title id="boothTitle">Late-night recording booth</title>
  <desc id="boothDesc">A walnut radio booth with a condenser microphone, lamp, and headphones. Original illustration.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a211a"/>
      <stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#e0b86a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#e0b86a" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lampg" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#f3eadc"/>
      <stop offset="0.45" stop-color="#e0b86a"/>
      <stop offset="1" stop-color="#8f6e34"/>
    </radialGradient>
  </defs>
  <rect x="28" y="18" width="424" height="504" rx="28" fill="url(#wall)" stroke="#c9a15b" stroke-opacity="0.28"/>
  <rect x="58" y="48" width="364" height="210" rx="12" fill="#0e0b09" stroke="#c9a15b" stroke-opacity="0.2"/>
  <rect x="74" y="64" width="332" height="178" rx="6" fill="#16110d"/>
