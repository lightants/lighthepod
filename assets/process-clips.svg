<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Vertical clip frames process demo, not a client file">
  <defs>
    <linearGradient id="process-clips-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1628"/>
      <stop offset="1" stop-color="#0b0910"/>
    </linearGradient>
    <radialGradient id="process-clips-l1" cx="88%" cy="8%" r="55%">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="process-clips-l2" cx="8%" cy="92%" r="50%">
      <stop offset="0" stop-color="#d94a8a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d94a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="process-clips-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#process-clips-bg)"/>
  <rect width="640" height="400" fill="url(#process-clips-l1)"/>
  <rect width="640" height="400" fill="url(#process-clips-l2)"/>
  
  <text x="32" y="48" fill="#ff8a6a" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="3">CLIPS · PROCESS DEMO</text>
  <g fill="none" stroke="#f6eee6" stroke-width="2">
    <rect x="80" y="80" width="140" height="250" rx="22" opacity="0.7"/>
    <rect x="250" y="80" width="140" height="250" rx="22" opacity="0.7"/>
    <rect x="420" y="80" width="140" height="250" rx="22" opacity="0.7"/>
  </g>
  <rect x="96" y="104" width="108" height="180" rx="6" fill="#ff5a3c" opacity="0.28"/>
  <rect x="266" y="104" width="108" height="180" rx="6" fill="#d94a8a" opacity="0.28"/>
  <rect x="436" y="104" width="108" height="180" rx="6" fill="#f6eee6" opacity="0.12"/>
  <circle cx="150" cy="304" r="8" fill="none" stroke="#f6eee6" stroke-width="1.4"/>
  <circle cx="320" cy="304" r="8" fill="none" stroke="#f6eee6" stroke-width="1.4"/>
  <circle cx="490" cy="304" r="8" fill="none" stroke="#f6eee6" stroke-width="1.4"/>
  <path d="M150 150 h0 M320 150 h0" stroke="#ff5a3c"/>
  <path d="M128 194 h44 M298 178 h44 M468 210 h44" stroke="#ff8a6a" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <rect width="640" height="400" filter="url(#process-clips-grain)"/>
  <rect x="14" y="14" width="612" height="372" fill="none" stroke="#f6eee6" stroke-opacity="0.12" stroke-width="1"/>
</svg>
