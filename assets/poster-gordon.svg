<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Abstract booth and meter rings">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1628"/>
      <stop offset="1" stop-color="#0b0910"/>
    </linearGradient>
    <radialGradient id="leak1" cx="88%" cy="8%" r="55%">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leak2" cx="8%" cy="92%" r="50%">
      <stop offset="0" stop-color="#d94a8a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d94a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.09"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#leak1)"/>
  <rect width="640" height="400" fill="url(#leak2)"/>
  
  <circle cx="320" cy="200" r="118" fill="none" stroke="#ff5a3c" stroke-width="1.4" opacity="0.5"/>
  <circle cx="320" cy="200" r="78" fill="none" stroke="#f6eee6" stroke-width="1.2" opacity="0.35"/>
  <circle cx="320" cy="200" r="42" fill="none" stroke="#d94a8a" stroke-width="2"/>
  <rect x="308" y="86" width="24" height="48" rx="12" fill="#ff5a3c"/>
  <path d="M320 134 v40" stroke="#f6eee6" stroke-width="3" stroke-linecap="round"/>
  <g fill="#f6eee6" opacity="0.8">
    <rect x="80" y="168" width="8" height="64" rx="2"/><rect x="96" y="148" width="8" height="104" rx="2"/>
    <rect x="112" y="176" width="8" height="48" rx="2"/><rect x="520" y="160" width="8" height="80" rx="2"/>
    <rect x="536" y="140" width="8" height="120" rx="2"/><rect x="552" y="184" width="8" height="32" rx="2"/>
  </g>

  <rect width="640" height="400" filter="url(#grain)"/>
  <rect x="14" y="14" width="612" height="372" fill="none" stroke="#f6eee6" stroke-opacity="0.12" stroke-width="1"/>
</svg>
