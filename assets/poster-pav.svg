<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Split audio and picture panels">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1628"/>
      <stop offset="1" stop-color="#0b0910"/>
    </linearGradient>
    <radialGradient id="leak1" cx="88%" cy="8%" r="55%">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="leak2" cx="8%" cy="92%" r="50%">
      <stop offset="0" stop-color="#d94a8a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d94a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.09"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#leak1)"/>
  <rect width="640" height="400" fill="url(#leak2)"/>
  
  <rect x="70" y="90" width="240" height="220" rx="10" fill="none" stroke="#f6eee6" stroke-opacity="0.35"/>
  <rect x="330" y="90" width="240" height="220" rx="10" fill="none" stroke="#ff5a3c" stroke-opacity="0.55"/>
  <path d="M90 200 C120 140, 150 260, 180 190 S240 120, 280 205" fill="none" stroke="#ff8a6a" stroke-width="2.4"/>
  <rect x="360" y="130" width="180" height="100" rx="4" fill="#1c1628" stroke="#f6eee6" stroke-opacity="0.25"/>
  <path d="M430 155 l40 25 -40 25 z" fill="#ff5a3c"/>
  <text x="186" y="340" text-anchor="middle" fill="#c9c0b6" font-size="13" font-family="sans-serif" letter-spacing="3">AUDIO</text>
  <text x="450" y="340" text-anchor="middle" fill="#c9c0b6" font-size="13" font-family="sans-serif" letter-spacing="3">PICTURE</text>

  <rect width="640" height="400" filter="url(#grain)"/>
  <rect x="14" y="14" width="612" height="372" fill="none" stroke="#f6eee6" stroke-opacity="0.12" stroke-width="1"/>
</svg>
