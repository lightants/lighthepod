  <path d="M246 200 h148" stroke="#ff5a3c" stroke-width="40" opacity="0.35"/>
  <circle cx="320" cy="330" r="10" fill="none" stroke="#f6eee6" stroke-width="1.5"/>
  <rect x="300" y="54" width="40" height="6" rx="3" fill="#f6eee6" opacity="0.4"/>
  <path d="M90 120 h110 M90 150 h80 M430 250 h120 M430 280 h90" stroke="#d94a8a" stroke-width="6" stroke-linecap="round" opacity="0.5"/>

  <rect width="640" height="400" filter="url(#grain)"/>
  <rect x="14" y="14" width="612" height="372" fill="none" stroke="#f6eee6" stroke-opacity="0.12" stroke-width="1"/>
