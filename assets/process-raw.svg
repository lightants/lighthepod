<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Noisy raw waveform process demo, not a client file">
  <defs>
    <linearGradient id="process-raw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1628"/>
      <stop offset="1" stop-color="#0b0910"/>
    </linearGradient>
    <radialGradient id="process-raw-l1" cx="88%" cy="8%" r="55%">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="process-raw-l2" cx="8%" cy="92%" r="50%">
      <stop offset="0" stop-color="#d94a8a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d94a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="process-raw-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#process-raw-bg)"/>
  <rect width="640" height="400" fill="url(#process-raw-l1)"/>
  <rect width="640" height="400" fill="url(#process-raw-l2)"/>
  
  <text x="32" y="48" fill="#ff8a6a" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="3">RAW · PROCESS DEMO</text>
  <path d="M40 220 C70 90, 100 310, 130 160 S190 40, 220 250 S280 360, 310 120 S370 30, 400 270 S460 350, 490 90 S550 40, 600 230" fill="none" stroke="#c9c0b6" stroke-width="2.2" opacity="0.45"/>
  <path d="M40 228 C72 140, 98 280, 132 190 S188 80, 224 240 S276 320, 314 150 S368 70, 404 250 S458 310, 492 140 S548 90, 600 236" fill="none" stroke="#ff5a3c" stroke-width="1.4" opacity="0.7"/>
  <g fill="#f6eee6" opacity="0.25">
    <circle cx="120" cy="110" r="1.6"/><circle cx="210" cy="80" r="1.2"/><circle cx="340" cy="60" r="1.8"/>
    <circle cx="470" cy="100" r="1.3"/><circle cx="540" cy="70" r="1.5"/><circle cx="180" cy="300" r="1.4"/>
    <circle cx="390" cy="320" r="1.7"/><circle cx="510" cy="280" r="1.2"/>
  </g>
  <rect x="40" y="320" width="560" height="8" rx="2" fill="#f6eee6" opacity="0.08"/>
  <rect x="40" y="336" width="220" height="6" rx="2" fill="#ff5a3c" opacity="0.35"/>

  <rect width="640" height="400" filter="url(#process-raw-grain)"/>
  <rect x="14" y="14" width="612" height="372" fill="none" stroke="#f6eee6" stroke-opacity="0.12" stroke-width="1"/>
</svg>
