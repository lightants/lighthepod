<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Restored clean waveform process demo, not a client file">
  <defs>
    <linearGradient id="process-restored-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1628"/>
      <stop offset="1" stop-color="#0b0910"/>
    </linearGradient>
    <radialGradient id="process-restored-l1" cx="88%" cy="8%" r="55%">
      <stop offset="0" stop-color="#ff5a3c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff5a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="process-restored-l2" cx="8%" cy="92%" r="50%">
      <stop offset="0" stop-color="#d94a8a" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d94a8a" stop-opacity="0"/>
    </radialGradient>
    <filter id="process-restored-grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.1"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#process-restored-bg)"/>
  <rect width="640" height="400" fill="url(#process-restored-l1)"/>
  <rect width="640" height="400" fill="url(#process-restored-l2)"/>
  
  <text x="32" y="48" fill="#ff8a6a" font-size="14" font-family="ui-sans-serif, system-ui, sans-serif" letter-spacing="3">RESTORED · PROCESS DEMO</text>
  <path d="M40 210 C90 150, 140 270, 190 200 S290 120, 340 210 S440 290, 490 200 S560 150, 600 210" fill="none" stroke="#ff8a6a" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M40 210 C90 180, 140 240, 190 208 S290 170, 340 212 S440 250, 490 208 S560 180, 600 212" fill="none" stroke="#f6eee6" stroke-width="1.6" opacity="0.55"/>
  <g fill="#ff5a3c">
    <rect x="80" y="300" width="8" height="40" rx="2"/><rect x="100" y="284" width="8" height="56" rx="2"/>
    <rect x="120" y="292" width="8" height="48" rx="2"/><rect x="140" y="276" width="8" height="64" rx="2"/>
    <rect x="160" y="288" width="8" height="52" rx="2"/><rect x="180" y="270" width="8" height="70" rx="2"/>
  </g>

  <rect width="640" height="400" filter="url(#process-restored-grain)"/>
  <rect x="14" y="14" width="612" height="372" fill="none" stroke="#f6eee6" stroke-opacity="0.12" stroke-width="1"/>
</svg>
